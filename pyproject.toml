[project]
name = "evogenui-bench"
version = "0.1.0"
description = "Multi-turn generative interface benchmark with browser-grounded evaluation"
requires-python = ">=3.11"
dependencies = [
  "browser-use>=0.12.6",
  "flask>=3.1.3",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "playwright>=1.45.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0.0",
  "pytest>=8.3.0",
  "ruff>=0.6.2",
]

[project.scripts]
evogenui-bench = "runner.orchestration.cli:main"
evogenui-web = "web.app:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runner*", "runtime*", "web*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["node_modules", "experiments"]
